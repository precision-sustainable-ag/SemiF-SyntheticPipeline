defaults:
  - cutout_filters: default
  - paths: default
  - _self_

hydra:
  run:
    dir: ${paths.workdir}/projects/${project_name}/${sub_name}
  output_subdir: ${paths.workdir}/projects/${project_name}/${sub_name}


project_name: pm3d
sub_name: mixed

# The original SQLite/storage workflow remains the default.
cutout_source: legacy  # legacy, seg_to_cut, or agir_db
agir_db:
  # Filter names through cutout_filters.category.common_name.
  min_area_cm2: 0
  max_area_cm2: null
  class_weights: {}  # optional common_name: weight mapping
seg_to_cut:
  runs: []  # Paths to completed seg_to_cut/<run_id> directories
  validated: null  # null accepts both reviewed and unreviewed cutouts
  is_primary: null
  common_names: []  # empty accepts all classes
  placements: [unrestricted]  # add edge/corner placements when suitable cutouts are scarce
  min_area_cm2: 0  # Minimum cutout area in cm²; 0 imposes no extra lower limit
  max_area_cm2: null  # Maximum cutout area in cm²; null imposes no upper limit
  class_weights: {}  # optional common_name: weight mapping

tasks:
  # - json_to_mongo # Deprecated
  create_recipes:
  analysis:
    - analyze_cutouts
    - analyze_preprocessed_cutouts
  move_cutouts: 
  preprocess_cutouts:
  synthesize: 

move_cutouts:
  parallel: True
  parallel_workers: 8

preprocess_cutouts:
  remove_soil: # applies exg filter, working range [0,100]
    Hairy Vetch: 20
    Crimson Clover: 100
  num_workers: 20

    
synthesize:
  parallel: false
  parallel_workers: 4
  semantic_masks: True
  instance_masks: False
  yolo_contour_labels: False  # TODO: Convert this to generate COCO-format labels instead of YOLO-style contours
  yolo_bbox_labels: False

sqlite3:
  dev_imgs: "semif_developed_images" # Table name
  cutouts: "semif_cutouts" # Table name
  db_name: "agir"
