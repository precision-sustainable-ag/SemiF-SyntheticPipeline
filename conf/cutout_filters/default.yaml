# Settings

total_images: 10

# background_fov_cm2: 7500 # bbot images, Assumed real-world field of view for backgrounds (in cm²)
background_fov_cm2: 3000  # unsplash images Assumed real-world field of view for backgrounds (in cm²)
resize_factor: 0.5

cuts_n_image: # Number of cutouts per image
  min: 3
  max: 10

reuse_cutouts: true  # Whether to allow reusing cutouts in multiple images
min_visibility: 0.9  # Minimum visibility ratio required for the new cutout
morphological:
  non_target_weed: false  # Querying for non_target_weed == false
  non_target_weed_pred_conf:
    min: 0.9
    max: 1.0  # Confidence must be between 0.5 and 1.0
  # Filter settings for morphological properties under "cutout_props"
  is_primary: 
  extends_border: false
  
  bbox_area_cm2:  # Area range in cm2
    min: 1000
    max: 1000000
    area_categories:
    # very_small: [0, 0.1]
    # small: [0.1, 1]
    # medium: [1, 10]
    # medium_large: [10, 100]
    # large: [100, 1000]
    # very_large: [1000, 1000000]
  
  blur_effect:  # Blur effect threshold
    min: 
    max: 
  num_components: # Number of components range
    min:
    max:
  
category:
  # Filter settings for category attributes
  family:  # Exact family
  genus:   # Exact genus
  group:   # Exact group
  duration: #["annual", "biennial"]  # Include either annual or biennial plants
  growth_habit: #["graminoid", "forb/herb"]  # Growth habit
  species:   # Exact species
  subclass:   # Exact subclass
  common_name: 
    - black oats
    - oats
    - cereal rye
    - crimson clover
    - red clover
    - winter pea
    - hairy vetch
    
common_name_weights:
    crimson clover: 0.25  # Broadleaf
    red clover: 0.25      # Broadleaf
    winter pea: 0.25      # Broadleaf
    hairy vetch: 0.3     # Broadleaf
    black oats: 0.001      # Grass
    oats: 0.001            # Grass
    cereal rye: 0.001      # Grass
    