# Settings

total_images: 2000

# background_fov_cm2: 1500 # bbot images, Assumed real-world field of view for backgrounds (in cm²)
background_fov_cm2: 750  # unsplash images Assumed real-world field of view for backgrounds (in cm²)
resize_factor: .40

cuts_n_image: # Number of cutouts per image
  min: 100
  max: 102

reuse_cutouts: true  # Whether to allow reusing cutouts in multiple images
min_visibility: 0.0  # Minimum visibility ratio required for the new cutout
morphological:
  non_target_weed:  # Querying for non_target_weed == false
  non_target_weed_pred_conf:
    min:
    max:  # Confidence must be between 0.5 and 1.0
  # Filter settings for morphological properties under "cutout_props"
  is_primary: true
  extends_border: false
  validated: true
  
  bbox_area_cm2:  # Area range in cm2
    default:
      min: 0
      max: 1000000
    common_name_ranges: # applies to specific common names, use default if not specified here but in the common_name list
        Cereal Rye:
          min: 0
          max: 1000000
        Hairy vetch:
          min: 0
          max: 1000000
    
    # very_small: [0, 0.1]
    # small: [0.1, 1]
    # medium: [1, 10]
    # medium_large: [10, 100]
    # large: [100, 1000]
    # very_large: [1000, 1000000]
  
  blur_effect:  # Blur effect threshold
    min: 
    max: 
  num_components: # Number of components range
    min: 
    max: 

  rgb:
    default:
      mean:
        red: {}
        green: {}
        blue: {}
      std:
        red: {}
        green: {}
        blue: {}
    common_name_ranges:
        Cereal Rye:
          mean:
            red: {min: 0.35, max: 0.40}
            green: {min: 0.31, max: 0.40}
            blue: {min: 0.275, max: 0.325}
          std:
            red: {min: 0.14, max: 0.20}
            green: {min: 0.14, max: 0.21}
            blue: {min: 0.14, max: 0.20}
        Hairy vetch:
          mean:
            red: {min: 0.375, max: 0.555}
            green: {min: 0.34, max: 0.48}
            blue: {min: 0.20, max: 0.40}
          std:
            red: {min: 0.14, max: 0.20}
            green: {min: 0.165, max: 0.221}
            blue: {min: 0.15, max: 0.221}


category:
  # Filter settings for category attributes
  common_name:
    - Hairy vetch
    - Cereal Rye

common_name_weights:
    Cereal Rye:  0.70
    Hairy vetch: 0.30

